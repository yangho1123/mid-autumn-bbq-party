services:
  - type: web
    name: mid-autumn-bbq-party
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: bbq-party-data
      mountPath: /var/data
      sizeGB: 1
